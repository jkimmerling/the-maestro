[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-tui"
version = "0.1.0"
description = "Python Textual TUI client for The Maestro"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Maestro Team"}]
dependencies = [
  "textual>=0.47.0",
  "httpx>=0.25.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "aiofiles>=23.0.0",
  "watchdog>=3.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.6.0",
  "black>=24.8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
[project.scripts]
maestro-tui = "maestro_tui.app:main"

