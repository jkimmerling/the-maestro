name: Release TUI Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps (PyInstaller)
        working-directory: clients/maestro_tui_python
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller

      - name: Build binary
        working-directory: clients/maestro_tui_python
        run: |
          pyinstaller --clean -y pyinstaller.spec

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd clients/maestro_tui_python/dist
          tar -czf maestro-tui-${{ runner.os }}.tar.gz maestro-tui

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd clients/maestro_tui_python\dist
          powershell -Command "Compress-Archive -Path maestro-tui -DestinationPath maestro-tui-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-tui-${{ runner.os }}
          path: |
            clients/maestro_tui_python/dist/maestro-tui-*.tar.gz
            clients/maestro_tui_python/dist/maestro-tui-*.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/maestro-tui-*.tar.gz
            artifacts/**/maestro-tui-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

